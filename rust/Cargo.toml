[package]
name = "cutter_engine"
version = "0.6.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
cpal = "0.18"
crossbeam-channel = "0.5"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
flutter_rust_bridge = "=2.13.0"
irondash_engine_context = "0.5"
irondash_run_loop = "0.5"
irondash_texture = "0.5"
parking_lot = "0.12"
png = "0.17"
tract-onnx = "0.23.9"

# On Android FFmpeg is built by hand for arm64 (LGPL, with MediaCodec) and
# linked statically from `FFMPEG_DIR`, so the one library the app loads holds
# the whole engine. Other targets keep the system FFmpeg.
[target.'cfg(target_os = "android")'.dependencies]
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling", "static"] }

[profile.release]
lto = "thin"
codegen-units = 1
# File and line for every frame of a native crash. The Android build strips
# these from the APK, and the Crashlytics Gradle plugin uploads them from the
# unstripped library first, so the crash report names the Rust function.
debug = "line-tables-only"

[profile.dev]
# Decoding and compositing are unusable without optimisation, even in debug.
opt-level = 2

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

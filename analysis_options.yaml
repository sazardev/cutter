include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - lib/l10n/app_localizations*.dart
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/*.mocks.dart"
    - build/**
    - android/**
    - ios/**
    - linux/**
    # Flutter Rust Bridge output and the vendored cargokit build tool.
    - lib/core/engine/bridge/**
    - rust_builder/**
    - rust/**

name: cutter
description: Cutter, a multi-layer video editor for mobile phones and tablets.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  archive: ^4.5.2
  cutter_engine:
    path: rust_builder
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  dynamic_color: ^1.8.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_rust_bridge: 2.13.0
  gal: ^2.3.2
  intl: any
  irondash_engine_context: ^0.5.5
  package_info_plus: ^10.2.2
  path_provider: ^2.1.4
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - CHANGELOG.md

name: Music packs

# Builds the music packs the app downloads and publishes them as the
# `music-v1` release (tool/music_packs/README.md). Run it by hand from the
# Actions tab; the app reads the release's catalog.json by default.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dart
        uses: dart-lang/setup-dart@e630b99d28a3b71860378cafdc2a067c71107f94 # v1.7.0

      - name: Install dependencies
        working-directory: tool/music_packs
        run: dart pub get

      - name: Build the packs
        run: dart run tool/music_packs/build_packs.dart --out build/music_packs

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=music-v1
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Music packs" \
            --notes "Genre packs the app downloads. Built by tool/music_packs; see its README for sources and licences."
          gh release upload "$tag" build/music_packs/*.zip build/music_packs/catalog.json --clobber
